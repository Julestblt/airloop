[advisories]
# RUSTSEC-2023-0071 (rsa, Marvin attack): a timing side channel in RSA
# *private-key* decryption/signing. The rsa crate is pulled in by airplay2-rs
# for legacy AirPlay 1 key wrapping, which only encrypts with the receiver's
# public key. Airloop never holds or uses an RSA private key, so the attack does
# not apply. No fixed rsa release exists yet; revisit when one does.
ignore = ["RUSTSEC-2023-0071"]
