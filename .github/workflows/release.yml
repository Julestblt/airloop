name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: cargo test --workspace
      - run: pnpm tauri build --bundles nsis
        working-directory: app
      - run: cargo build --release -p airloop-cli
      - name: Collect assets
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe "dist-release/Airloop_${v}_x64-setup.exe"
          Compress-Archive -Path target/release/airloop.exe, target/release/airloop-cli.exe, LICENSE -DestinationPath "dist-release/Airloop_${v}_x64-portable.zip"
          Get-ChildItem dist-release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii dist-release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          body: |
            **Unsigned build.** Windows SmartScreen will warn that the publisher is unknown:
            click *More info → Run anyway*. Verify the download against `SHA256SUMS.txt`.

            See the README for supported speakers and known limitations.
