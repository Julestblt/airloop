[package]
name = "airloop-capture"
description = "Windows audio capture (WASAPI loopback) for Airloop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
airloop-engine = { path = "../engine" }
serde.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
rubato = "0.16"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
